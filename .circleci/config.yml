version: 2.1

orbs:
  cypress:   cypress-io/cypress@4
  coveralls: coveralls/coveralls@2

aliases:
  .node-image: &node-image cimg/node:22.16

  .tag-filter: &tag-filter
    filters:
      tags:
        only: /.*/

  when-release: &when-release
    and:
      - matches:
          pattern: '^release-[0-9]{8}\.[0-9]+$'
          value: << pipeline.git.tag >>

  prod-deploy-job: &prod-deploy-job
    context: aws-prod
    requires:
      - release-approval

commands:
  setup-fa-auth:
    steps:
      - run:
          name: Configure npm registry auth
          command: |
            cat > ~/.npmrc \<< EOF
            # Pro Font Awesome registry
            @fortawesome:registry=https://npm.fontawesome.com/
            //npm.fontawesome.com/:_authToken=${FONTAWESOME}
            EOF
            echo "📦 Created ~/.npmrc"

  restore-npm-cache:
    steps:
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-

  save-npm-cache:
    steps:
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  install-dependencies:
    steps:
      - run:
          name: Verify Node version matches .nvmrc
          command: |
            if [ ! -f .nvmrc ]; then
              echo "Missing .nvmrc at repo root"
              exit 1
            fi
            expected="$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')"
            expected_major_minor="$(echo "$expected" | cut -d. -f1,2)"
            actual_major_minor="$(node -p 'process.versions.node.split(".").slice(0, 2).join(".")')"
            if [ "$expected_major_minor" != "$actual_major_minor" ]; then
              echo "Node version mismatch: .nvmrc=${expected_major_minor}, image=${actual_major_minor}"
              exit 1
            fi
      - setup-fa-auth
      - run:
          name: Install dependencies
          command: npm ci --prefer-offline --no-audit

# ------------------------------------------------------------
# EXECUTOR  –  Node 22 LTS image with Chrome 137, FF 139, Edge 137
# ------------------------------------------------------------
executors:
  cypress-all-browsers:
    docker:
      - image: cypress/browsers:node-22.16.0-chrome-137.0.7151.68-1-ff-139.0.1-edge-137.0.3296.62-1
    environment:
      DISPLAY: :99
      CYPRESS_DISPLAY: :99
      CYPRESS_COVERAGE: true
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      CYPRESS_watchForFileChanges: false

# ------------------------------------------------------------
# JOBS
# ------------------------------------------------------------
jobs:
  lint:
    docker:
      - image: *node-image
    steps:
      - checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: ESLint
          command: npm run eslint
      - run:
          name: Stylelint
          command: npm run stylelint

  run-cypress:
    parameters:
      cypress_command:
        type: string
      should_build:
        type: boolean
        default: true
      parallelism:
        type: integer
        default: 12
      upload_coverage:
        type: boolean
        default: true
    executor: cypress-all-browsers
    parallelism: << parameters.parallelism >>
    steps:
      # Checkout
      - checkout

      # Install & start virtual display
      - run:
          name: Install & start Xvfb
          command: |
            # launch 24-bit virtual display :99
            Xvfb :99 -screen 0 1024x768x24 -nolisten tcp &
            # wait until the X socket appears (max 10 s)
            for i in {1..20}; do
              if xdpyinfo -display :99 >/dev/null 2>&1; then
                echo "🟢 Xvfb :99 is up"
                break
              fi
              echo "⌛ waiting for Xvfb…"
              sleep 0.5
            done
      - restore-npm-cache
      - install-dependencies
      - cypress/install:
          skip-checkout: true
          install-browsers: false

      # Build app
      - when:
          condition: << parameters.should_build >>
          steps:
            - run: npx vite build -m test

            - run:
                name: Start Server
                command: npx vite preview -m test
                background: true

      # Run Cypress
      - run:
          name: Cypress tests
          command: << parameters.cypress_command >>

      # Coverage upload (PR / push only)
      - when:
          condition: << parameters.upload_coverage >>
          steps:
            - run:
                name: Install curl (if missing)
                command: |
                  if ! command -v curl >/dev/null; then
                    apt-get update -y && apt-get install --no-install-recommends -y curl
                  fi

            - run: npm run coverage:report:ci || true

            - coveralls/upload:
                fail_on_error: false
                parallel: true

  coveralls-finish:
    docker:
      - image: cimg/base:stable
    steps:
      - coveralls/upload:
          parallel_finished: true

  build:
    docker:
      - image: *node-image
    steps:
      - checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: Npm build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy:
    docker:
      - image: *node-image
    parameters:
      stage:
        type: string
      deploy-name:
        type: string
        default: Deploy to S3
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-npm-cache
      - install-dependencies
      - run:
          name: << parameters.deploy-name >>
          command: npm run deploy -- --stage=<< parameters.stage >>

# ------------------------------------------------------------
# WORKFLOWS
# ------------------------------------------------------------
workflows:
  test-build:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      - lint:
          name: Lint
      - run-cypress:
          name: E2E
          cypress_command: >
            npx cypress run
            --env COVERAGE=true
            --parallel --record
            --group care-ops-e2e

      - run-cypress:
          name: Component
          parallelism: 6
          should_build: false
          cypress_command: >
            npx cypress run --component
            --env COVERAGE=true
            --parallel --record
            --group care-ops-component

      - coveralls-finish:
          name: Coveralls
          requires:
            - E2E
            - Component

  test-nightly:
    triggers:
      - schedule:
          cron: "0 11 * * *"
          filters:
            branches:
              only: develop
    jobs:
      - run-cypress:
          name: Chrome nightly
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser chrome
            --parallel --record
            --group chrome-e2e
            --config retries=4

      - run-cypress:
          name: Chrome nightly Component
          parallelism: 6
          should_build: false
          upload_coverage: false
          cypress_command: >
            npx cypress run --component
            --browser chrome
            --parallel --record
            --group chrome-component
            --config retries=4

      - run-cypress:
          name: Firefox nightly
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser firefox
            --parallel --record
            --group firefox-e2e
            --config retries=4

      - run-cypress:
          name: Firefox nightly Component
          parallelism: 6
          should_build: false
          upload_coverage: false
          cypress_command: >
            npx cypress run --component
            --browser firefox
            --parallel --record
            --group firefox-component
            --config retries=4

      - run-cypress:
          name: Edge nightly
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser edge
            --parallel --record
            --group edge-e2e
            --config retries=4

      - run-cypress:
          name: Edge nightly Component
          parallelism: 6
          should_build: false
          upload_coverage: false
          cypress_command: >
            npx cypress run --component
            --browser edge
            --parallel --record
            --group edge-component
            --config retries=4

  deploy-sandboxes:
    when: *when-release
    jobs:
      - build:
          <<: *tag-filter
          context: aws-prod
      - release-approval:
          <<: *tag-filter
          type: approval
          requires:
            - build
      - deploy:
          <<: [*tag-filter, *prod-deploy-job]
          name: deploy sandboxes
          stage: sandbox
          deploy-name: Deploy sandbox stacks to S3

  deploy-clients:
    when: *when-release
    jobs:
      - build:
          <<: *tag-filter
          context: aws-prod
      - release-approval:
          <<: *tag-filter
          type: approval
          requires:
            - build
      - deploy:
          <<: [*tag-filter, *prod-deploy-job]
          name: deploy prod
          stage: prod
          deploy-name: Deploy production clients to S3
