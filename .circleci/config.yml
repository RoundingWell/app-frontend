version: 2.1

orbs:
  cypress:   cypress-io/cypress@4
  coveralls: coveralls/coveralls@2

# ------------------------------------------------------------
# EXECUTOR  –  Node 22 LTS image with Chrome 137, FF 139, Edge 137
# ------------------------------------------------------------
executors:
  cypress-all-browsers:
    docker:
      - image: cypress/browsers:node-22.16.0-chrome-137.0.7151.68-1-ff-139.0.1-edge-137.0.3296.62-1
    environment:
      DISPLAY: :99
      CYPRESS_DISPLAY: :99
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      CYPRESS_watchForFileChanges: false

# ------------------------------------------------------------
# JOBS
# ------------------------------------------------------------
jobs:
  run-cypress:
    parameters:
      cypress_command:
        type: string
      start_command:
        type: string
        default: "npx vite preview -m test"
      parallelism:
        type: integer
        default: 10
      upload_coverage:
        type: boolean
        default: true
    executor: cypress-all-browsers
    parallelism: << parameters.parallelism >>
    steps:
      # 1 Checkout
      - checkout

      # 2 Install & start virtual display
      - run:
          name: Install & start Xvfb
          command: |
            # launch 24-bit virtual display :99
            Xvfb :99 -screen 0 1024x768x24 -nolisten tcp &
            # wait until the X socket appears (max 10 s)
            for i in {1..20}; do
              if xdpyinfo -display :99 >/dev/null 2>&1; then
                echo "🟢 Xvfb :99 is up"
                break
              fi
              echo "⌛ waiting for Xvfb…"
              sleep 0.5
            done

      # 3 Dependencies + Cypress binary (cached)
      - cypress/install:
          skip-checkout: true
          install-browsers: false

      # 4 Build app (cached)
      - restore_cache:
          keys:
            - vite-dist-{{ checksum "vite.config.js" }}
      - run: npx vite build -m test
      - save_cache:
          key: vite-dist-{{ checksum "vite.config.js" }}
          paths: dist

      # 5 Start Server
      - when:
          condition: << parameters.start_command >>
          steps:
            - run:
                name: Start Server
                command: << parameters.start_command >>
                background: true

      # 6 Run Cypress
      - run:
          name: Cypress tests
          command: << parameters.cypress_command >>

      # 7 Coverage upload (PR / push only)
      - when:
          condition: << parameters.upload_coverage >>
          steps:
            - run:
                name: Install curl (if missing)
                command: |
                  if ! command -v curl >/dev/null; then
                    apt-get update -y && apt-get install --no-install-recommends -y curl
                  fi
            - run: npm run coverage:report:ci || true
            - coveralls/upload:
                parallel: true

  coveralls-finish:
    docker:
      - image: cimg/base:stable
    steps:
      - coveralls/upload:
          parallel_finished: true

# ------------------------------------------------------------
# WORKFLOWS
# ------------------------------------------------------------
workflows:
  test-build:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      - run-cypress:
          name: E2E
          cypress_command: >
            npx cypress run
            --env COVERAGE=true
            --parallel --record
            --group care-ops-e2e
      - run-cypress:
          name: Component
          parallelism: 6
          start_command: ""
          cypress_command: >
            npx cypress run --component
            --env COVERAGE=true
            --parallel --record
            --group care-ops-component
      - coveralls-finish:
          name: Coveralls
          requires:
            - E2E
            - Component

  test-nightly:
    triggers:
      - schedule:
          cron: "0 11 * * *"
          filters:
            branches:
              only: develop
    jobs:
      - run-cypress:
          name: Chrome nightly
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser chrome
            --parallel --record
            --group chrome-e2e
            --config retries=4

      - run-cypress:
          name: Firefox nightly
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser firefox
            --parallel --record
            --group firefox-e2e
            --config retries=4

      - run-cypress:
          name: Edge nightly
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser edge
            --parallel --record
            --group edge-e2e
            --config retries=4
