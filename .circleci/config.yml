version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.0
  cypress:   cypress-io/cypress@4
  coveralls: coveralls/coveralls@2

aliases:
  .node-image: &node-image cimg/node:22.16

  .tag-filter: &tag-filter
    filters:
      tags:
        only: /.*/

  when-release: &when-release
    and:
      - matches:
          pattern: '^v[0-9]{6}\.[0-9]+$'
          value: << pipeline.git.tag >>

commands:
  setup-fa-auth:
    steps:
      - run:
          name: Configure npm registry auth
          command: |
            cat > ~/.npmrc \<< EOF
            # Pro Font Awesome registry
            @fortawesome:registry=https://npm.fontawesome.com/
            //npm.fontawesome.com/:_authToken=${FONTAWESOME}
            EOF
            echo "📦 Created ~/.npmrc"

  restore-npm-cache:
    steps:
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-

  save-npm-cache:
    steps:
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  install-dependencies:
    steps:
      - run:
          name: Verify Node version matches .nvmrc
          command: |
            expected="$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')"
            expected_major_minor="$(echo "$expected" | cut -d. -f1,2)"
            image_version="$(node -v)"
            image_version="${image_version#v}"
            if [[ "$image_version" != "$expected_major_minor".* ]]; then
              echo "Node version mismatch: .nvmrc=${expected_major_minor}, image=${image_version}"
              exit 1
            fi
      - setup-fa-auth
      - run:
          name: Install dependencies
          command: npm ci --prefer-offline --no-audit

  setup-aws-oidc:
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: app-frontend-${CIRCLE_BUILD_NUM}

# ------------------------------------------------------------
# EXECUTOR  –  Node 22 LTS image with Chrome 137, FF 139, Edge 137
# ------------------------------------------------------------
executors:
  cypress-all-browsers:
    docker:
      - image: cypress/browsers:node-22.16.0-chrome-137.0.7151.68-1-ff-139.0.1-edge-137.0.3296.62-1
    environment:
      DISPLAY: :99
      CYPRESS_DISPLAY: :99
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      CYPRESS_watchForFileChanges: false

# ------------------------------------------------------------
# JOBS
# ------------------------------------------------------------
jobs:
  lint:
    docker:
      - image: *node-image
    steps:
      - checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: ESLint
          command: npm run eslint
      - run:
          name: Stylelint
          command: npm run stylelint

  run-cypress:
    parameters:
      cypress_command:
        type: string
      should_build:
        type: boolean
        default: true
      parallelism:
        type: integer
        default: 12
      upload_coverage:
        type: boolean
        default: true
    executor: cypress-all-browsers
    parallelism: << parameters.parallelism >>
    steps:
      # Checkout
      - checkout

      # Install & start virtual display
      - run:
          name: Install & start Xvfb
          command: |
            # launch 24-bit virtual display :99
            Xvfb :99 -screen 0 1024x768x24 -nolisten tcp &
            # wait until the X socket appears (max 10 s)
            for i in {1..20}; do
              if xdpyinfo -display :99 >/dev/null 2>&1; then
                echo "🟢 Xvfb :99 is up"
                break
              fi
              echo "⌛ waiting for Xvfb…"
              sleep 0.5
            done
      - restore-npm-cache
      - install-dependencies
      - cypress/install:
          skip-checkout: true
          install-browsers: false

      # Build app
      - when:
          condition: << parameters.should_build >>
          steps:
            - run: npm run build -- --mode test

            - run:
                name: Start Server
                command: npx vite preview -m test
                background: true

      # Run Cypress
      - run:
          name: Cypress tests
          command: << parameters.cypress_command >>

      # Coverage upload (PR / push only)
      - when:
          condition: << parameters.upload_coverage >>
          steps:
            - run:
                name: Install curl (if missing)
                command: |
                  if ! command -v curl >/dev/null; then
                    apt-get update -y && apt-get install --no-install-recommends -y curl
                  fi

            - run: npm run coverage:report:ci || true

            - coveralls/upload:
                fail_on_error: false
                parallel: true

  coveralls-finish:
    docker:
      - image: *node-image
    steps:
      - coveralls/upload:
          parallel_finished: true

  build:
    docker:
      - image: *node-image
    steps:
      - checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: Npm build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish-build-artifact:
    docker:
      - image: *node-image
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-npm-cache
      - install-dependencies
      - run:
          name: Package build artifact
          command: |
            set -euo pipefail
            tag="<< pipeline.git.tag >>"
            if [ -z "$tag" ]; then
              echo "No pipeline.git.tag; refusing to publish artifact"
              exit 1
            fi

            tar -C dist -czf /tmp/dist.tar.gz .
            sha256sum /tmp/dist.tar.gz > /tmp/dist.tar.gz.sha256
      - run:
          name: CircleCI Release Marker Plan
          command: |
            set -euo pipefail
            circleci run release plan "release-<< pipeline.git.tag >>" \
              --environment-name="release" \
              --component-name="app-frontend" \
              --target-version="<< pipeline.git.tag >>"
      - run:
          name: Upload sourcemaps to Datadog
          command: |
            set -euo pipefail

            if [ -z "${DATADOG_API_KEY:-}" ]; then
              echo "DATADOG_API_KEY is required to upload sourcemaps"
              exit 1
            fi

            if ! find dist -type f -name '*.js.map' | grep -q .; then
              echo "No *.js.map files found in dist; failing release artifact publish"
              exit 1
            fi

            site_arg=()
            if [ -n "${DATADOG_SITE:-}" ]; then
              site_arg+=(--datadog-site="${DATADOG_SITE}")
            fi

            npx --yes @datadog/datadog-ci@5.8.0 sourcemaps upload dist \
              --service="app-frontend" \
              --release-version="<< pipeline.git.tag >>" \
              --minified-path-prefix="${DATADOG_MINIFIED_PATH_PREFIX:-/}" \
              "${site_arg[@]}"
      - setup-aws-oidc
      - run:
          name: Upload build artifact once per tag
          command: |
            set -euo pipefail
            npm run artifact:publish -- \
              --bucket=rw-frontend-artifacts-dev \
              --prefix=app-frontend \
              --tag="<< pipeline.git.tag >>" \
              --artifact=/tmp/dist.tar.gz
      - run:
          name: CircleCI Release Marker Success
          when: on_success
          command: |
            set -euo pipefail
            circleci run release update "release-<< pipeline.git.tag >>" --status=SUCCESS
      - run:
          name: CircleCI Release Marker Failure
          when: on_fail
          command: |
            set -euo pipefail
            circleci run release update "release-<< pipeline.git.tag >>" --status=FAILED
      - run:
          name: Sync Linear release
          when: on_success
          command: |
            set -uo pipefail
            # set -e is suspended on the left side of `||`, so chain commands
            # with `&&` to short-circuit on the first failure and let the
            # group's exit code reflect the actual outcome.
            { ./scripts/download-linear-release.sh \
                && git fetch --force --tags origin \
                && /tmp/linear-release sync \
                     --release-version="<< pipeline.git.tag >>" \
                && /tmp/linear-release update \
                     --release-version="<< pipeline.git.tag >>" \
                     --stage="Started"
            } || echo "Linear release sync failed; artifact published. Sync manually if needed."

# ------------------------------------------------------------
# WORKFLOWS
# ------------------------------------------------------------
workflows:
  test-build:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      - lint:
          name: Lint
      - run-cypress:
          filters:
            branches:
              only: develop
            tags:
              ignore: /.*/
          name: E2E develop
          parallelism: 1
          cypress_command: >
            npx cypress run

      - run-cypress:
          filters:
            branches:
              ignore: develop
            tags:
              ignore: /.*/
          name: E2E
          cypress_command: >
            npx cypress run
            --parallel --record
            --group care-ops-e2e

      - run-cypress:
          filters:
            branches:
              only: develop
            tags:
              ignore: /.*/
          name: Component develop
          parallelism: 1
          should_build: false
          cypress_command: >
            npx cypress run --component

      - run-cypress:
          filters:
            branches:
              ignore: develop
            tags:
              ignore: /.*/
          name: Component
          parallelism: 1
          should_build: false
          cypress_command: >
            npx cypress run --component

      - coveralls-finish:
          filters:
            branches:
              only: develop
            tags:
              ignore: /.*/
          name: Coveralls develop
          requires:
            - E2E develop
            - Component develop

      - coveralls-finish:
          filters:
            branches:
              ignore: develop
            tags:
              ignore: /.*/
          name: Coveralls
          requires:
            - E2E
            - Component

  test-nightly:
    triggers:
      - schedule:
          cron: "0 11 * * *"
          filters:
            branches:
              only: develop
    jobs:
      - run-cypress:
          name: Chrome nightly
          parallelism: 1
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser chrome
            --config retries=4

      - run-cypress:
          name: Chrome nightly Component
          parallelism: 1
          should_build: false
          upload_coverage: false
          cypress_command: >
            npx cypress run --component
            --browser chrome
            --config retries=4

      - run-cypress:
          name: Firefox nightly
          parallelism: 1
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser firefox
            --config retries=4

      - run-cypress:
          name: Firefox nightly Component
          parallelism: 1
          should_build: false
          upload_coverage: false
          cypress_command: >
            npx cypress run --component
            --browser firefox
            --config retries=4

      - run-cypress:
          name: Edge nightly
          parallelism: 1
          upload_coverage: false
          cypress_command: >
            npx cypress run
            --browser edge
            --config retries=4

      - run-cypress:
          name: Edge nightly Component
          parallelism: 1
          should_build: false
          upload_coverage: false
          cypress_command: >
            npx cypress run --component
            --browser edge
            --config retries=4

  release-artifact:
    when: *when-release
    jobs:
      - build:
          <<: *tag-filter
      - publish-build-artifact:
          <<: *tag-filter
          name: publish release artifact
          context:
            - aws-dev
            - linear-secrets
          requires:
            - build
