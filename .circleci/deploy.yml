version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.0
  slack: circleci/slack@6.1.3

aliases:
  .node-image: &node-image cimg/node:22.16

commands:
  setup-fa-auth:
    steps:
      - run:
          name: Configure npm registry auth
          command: |
            cat > ~/.npmrc \<< EOF
            # Pro Font Awesome registry
            @fortawesome:registry=https://npm.fontawesome.com/
            //npm.fontawesome.com/:_authToken=${FONTAWESOME}
            EOF
            echo "Created ~/.npmrc"

  restore-npm-cache:
    steps:
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-

  save-npm-cache:
    steps:
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  install-dependencies:
    steps:
      - run:
          name: Verify Node version matches .nvmrc
          command: |
            expected="$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')"
            expected_major_minor="$(echo "$expected" | cut -d. -f1,2)"
            image_version="$(node -v)"
            image_version="${image_version#v}"
            if [[ "$image_version" != "$expected_major_minor".* ]]; then
              echo "Node version mismatch: .nvmrc=${expected_major_minor}, image=${image_version}"
              exit 1
            fi
      - setup-fa-auth
      - run:
          name: Install dependencies
          command: npm ci --prefer-offline --no-audit

  setup-aws-oidc:
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: app-frontend-${CIRCLE_BUILD_NUM}

jobs:
  deploy-from-artifact:
    docker:
      - image: *node-image
    steps:
      - checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: Resolve deploy target
          command: |
            set -euo pipefail

            target_env="<< pipeline.deploy.environment_name >>"
            target_version="<< pipeline.deploy.target_version >>"

            if [ -z "$target_env" ]; then
              echo "Deploy target environment is required"
              exit 1
            fi

            if [ -z "$target_version" ]; then
              echo "Deploy target version is required"
              exit 1
            fi

            if [[ "$target_env" != *:* ]]; then
              echo "Unsupported deploy environment: $target_env"
              echo "Expected format: <stage>:<organization>"
              echo "Examples: dev:nick, qa:*, sandbox:banana, prod:apple"
              exit 1
            fi

            deploy_stage="${target_env%%:*}"
            deploy_organization="${target_env#*:}"

            case "$deploy_stage" in
              dev|qa|sandbox|prod)
                ;;
              *)
                echo "Unsupported deploy stage: $deploy_stage"
                echo "Supported stages: dev, qa, sandbox, prod"
                exit 1
                ;;
            esac

            if [ -z "$deploy_organization" ]; then
              echo "Deploy organization cannot be empty for target environment: $target_env"
              exit 1
            fi

            if [ "$deploy_organization" = "*" ] || [ "$deploy_organization" = "all" ]; then
              deploy_organization=""
            fi

            deploy_run_url="${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}"

            {
              echo "export DEPLOY_TARGET_ENV=$target_env"
              echo "export DEPLOY_TARGET_VERSION=$target_version"
              echo "export DEPLOY_STAGE=$deploy_stage"
              echo "export DEPLOY_ORGANIZATION=$deploy_organization"
              echo "export DEPLOY_RUN_URL=$deploy_run_url"
            } >> "$BASH_ENV"
      - setup-aws-oidc
      - run:
          name: Resolve deploy marker environments
          command: |
            set -euo pipefail

            deploy_tmp_dir="$(mktemp -d)"
            marker_env_file="$deploy_tmp_dir/deploy-marker-environments.txt"
            deploy_targets_file="$deploy_tmp_dir/deploy-targets.json"
            deploy_marker_status_file="$deploy_tmp_dir/deploy-marker-status.json"

            if [ -n "$DEPLOY_ORGANIZATION" ]; then
              npm run deploy -- --stage="$DEPLOY_STAGE" --organization="$DEPLOY_ORGANIZATION" --write-targets-file="$deploy_targets_file" --list-marker-environments > "$marker_env_file"
            else
              npm run deploy -- --stage="$DEPLOY_STAGE" --write-targets-file="$deploy_targets_file" --list-marker-environments > "$marker_env_file"
            fi

            if [ ! -s "$marker_env_file" ]; then
              echo "No deploy marker environments were resolved"
              exit 1
            fi

            printf 'export DEPLOY_TMP_DIR=%q\n' "$deploy_tmp_dir" >> "$BASH_ENV"
            printf 'export DEPLOY_MARKER_ENV_FILE=%q\n' "$marker_env_file" >> "$BASH_ENV"
            printf 'export DEPLOY_MARKER_STATUS_FILE=%q\n' "$deploy_marker_status_file" >> "$BASH_ENV"
            printf 'export DEPLOY_TARGETS_FILE=%q\n' "$deploy_targets_file" >> "$BASH_ENV"
      - run:
          name: Download release artifact
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            npm run artifact:download -- \
              --bucket=rw-frontend-artifacts-dev \
              --prefix=app-frontend \
              --tag="$DEPLOY_TARGET_VERSION" \
              --artifact=/tmp/dist.tar.gz
      - run:
          name: Unpack release artifact
          command: |
            set -euo pipefail
            rm -rf dist
            mkdir -p dist
            tar -C dist -xzf /tmp/dist.tar.gz
      - run:
          name: CircleCI Deploy Marker Plan
          command: |
            set -euo pipefail
            node scripts/deploy-markers.js plan \
              --component-name="app-frontend" \
              --env-file="$DEPLOY_MARKER_ENV_FILE" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: Deploy selected target
          command: |
            set -euo pipefail
            if [ -n "$DEPLOY_ORGANIZATION" ]; then
              npm run deploy -- --stage="$DEPLOY_STAGE" --organization="$DEPLOY_ORGANIZATION" --read-targets-file="$DEPLOY_TARGETS_FILE" --marker-status-file="$DEPLOY_MARKER_STATUS_FILE"
            else
              npm run deploy -- --stage="$DEPLOY_STAGE" --read-targets-file="$DEPLOY_TARGETS_FILE" --marker-status-file="$DEPLOY_MARKER_STATUS_FILE"
            fi
      - run:
          name: CircleCI Deploy Marker Success
          when: on_success
          command: |
            set -euo pipefail
            node scripts/deploy-markers.js update \
              --deploy-result="success" \
              --env-file="$DEPLOY_MARKER_ENV_FILE" \
              --status-file="$DEPLOY_MARKER_STATUS_FILE" \
              --target-environment="$DEPLOY_TARGET_ENV" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: CircleCI Deploy Marker Failure
          when: on_fail
          command: |
            set -euo pipefail
            node scripts/deploy-markers.js update \
              --deploy-result="failure" \
              --env-file="$DEPLOY_MARKER_ENV_FILE" \
              --status-file="$DEPLOY_MARKER_STATUS_FILE" \
              --target-environment="$DEPLOY_TARGET_ENV" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: Notify QA2 E2E repo
          when: on_success
          command: |
            set -euo pipefail

            if [ "$DEPLOY_STAGE" != "qa" ] || { [ -n "$DEPLOY_ORGANIZATION" ] && [ "$DEPLOY_ORGANIZATION" != "qa2" ]; }; then
              exit 0
            fi

            {
              git fetch --force --tags origin
              source_sha="$(git rev-list -n 1 "$DEPLOY_TARGET_VERSION")"
              node scripts/dispatch-qa2-e2e.js \
                --version="$DEPLOY_TARGET_VERSION" \
                --source-sha="$source_sha" \
                --source-run-url="$DEPLOY_RUN_URL"
            } || echo "QA2 E2E dispatch failed; rerun the deploy or dispatch manually if needed."
      - slack/notify:
          event: fail
          custom: |
            {
              "text": "Frontend deploy to << pipeline.deploy.environment_name >> << pipeline.deploy.target_version >>: failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Frontend deploy to << pipeline.deploy.environment_name >> `<< pipeline.deploy.target_version >>`: failed\n<${DEPLOY_RUN_URL:-${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}}|View run>"
                  }
                }
              ]
            }
      - slack/notify:
          event: pass
          custom: |
            {
              "text": "Frontend deploy to << pipeline.deploy.environment_name >> << pipeline.deploy.target_version >>: success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Frontend deploy to << pipeline.deploy.environment_name >> `<< pipeline.deploy.target_version >>`: success\n<${DEPLOY_RUN_URL:-${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}}|View run>"
                  }
                }
              ]
            }

workflows:
  deploy-dev:
    when:
      matches:
        pattern: '^(dev|qa):[a-z0-9*-]+$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-dev
            - slack-secrets

  deploy-prod:
    when:
      matches:
        pattern: '^(sandbox|prod):[a-z0-9*-]+$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-prod
            - slack-secrets
