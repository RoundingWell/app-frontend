version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.0
  slack: circleci/slack@6.1.3

aliases:
  .node-image: &node-image cimg/node:26.13

commands:
  restore-npm-cache:
    steps:
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-

  save-npm-cache:
    steps:
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  install-dependencies:
    steps:
      - run:
          name: Verify Node version matches .nvmrc
          command: |
            expected="$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')"
            expected_major_minor="$(echo "$expected" | cut -d. -f1,2)"
            image_version="$(node -v)"
            image_version="${image_version#v}"
            if [[ "$image_version" != "$expected_major_minor".* ]]; then
              echo "Node version mismatch: .nvmrc=${expected_major_minor}, image=${image_version}"
              exit 1
            fi
      - run:
          name: Install dependencies
          command: node scripts/install-icons-ci.mjs

  setup-aws-oidc:
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: app-frontend-${CIRCLE_BUILD_NUM}

  verify-production-checkout:
    steps:
      - run:
          name: Verify the protected deploy checkout
          environment:
            CONFIG_SHA: << pipeline.config.sha >>
          command: |
            set -euo pipefail
            if ! [[ "$CONFIG_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$CONFIG_SHA" ]; then
              echo "Production deploy must use the checked-in config and code from the same develop commit."
              exit 1
            fi

jobs:
  verify-production-approval:
    docker:
      - image: *node-image
    steps:
      - checkout
      - verify-production-checkout
      - setup-aws-oidc
      - run:
          name: Verify independent release approval
          environment:
            TARGET_ENV: << pipeline.deploy.environment_name >>
            TARGET_VERSION: << pipeline.deploy.target_version >>
          command: |
            set -euo pipefail
            mkdir -p /tmp/production-approval
            node scripts/production-approval.js verify /tmp/production-approval/proof.json \
              "$TARGET_ENV" "$TARGET_VERSION" "$CIRCLE_WORKFLOW_ID"
      - persist_to_workspace:
          root: /tmp/production-approval
          paths:
            - proof.json

  deploy-from-artifact:
    parameters:
      production_approval:
        type: boolean
        default: false
    docker:
      - image: *node-image
    steps:
      - checkout
      - when:
          condition: << parameters.production_approval >>
          steps:
            - verify-production-checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: Resolve deploy target
          command: |
            set -euo pipefail

            target_env="<< pipeline.deploy.environment_name >>"
            target_version="<< pipeline.deploy.target_version >>"

            if [ -z "$target_env" ]; then
              echo "Deploy target environment is required"
              exit 1
            fi

            if [ -z "$target_version" ]; then
              echo "Deploy target version is required"
              exit 1
            fi

            if [[ "$target_env" != *:* ]]; then
              echo "Unsupported deploy environment: $target_env"
              echo "Expected format: <stage>:<organization>"
              echo "Examples: dev:nick, qa:*, sandbox:banana, prod:apple"
              exit 1
            fi

            deploy_stage="${target_env%%:*}"
            deploy_organization="${target_env#*:}"

            case "$deploy_stage" in
              dev|qa|sandbox|prod)
                ;;
              *)
                echo "Unsupported deploy stage: $deploy_stage"
                echo "Supported stages: dev, qa, sandbox, prod"
                exit 1
                ;;
            esac

            if [ -z "$deploy_organization" ]; then
              echo "Deploy organization cannot be empty for target environment: $target_env"
              exit 1
            fi

            if [ "$deploy_organization" = "*" ] || [ "$deploy_organization" = "all" ]; then
              deploy_organization=""
            fi

            deploy_run_url="${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}"

            {
              echo "export DEPLOY_TARGET_ENV=$target_env"
              echo "export DEPLOY_TARGET_VERSION=$target_version"
              echo "export DEPLOY_STAGE=$deploy_stage"
              echo "export DEPLOY_ORGANIZATION=$deploy_organization"
              echo "export DEPLOY_RUN_URL=$deploy_run_url"
            } >> "$BASH_ENV"
      - when:
          condition: << parameters.production_approval >>
          steps:
            - attach_workspace:
                at: /tmp/production-approval
      - run:
          name: Require matching approval before assuming the production role
          command: |
            set -euo pipefail
            if [ "$DEPLOY_STAGE" = prod ] && [ "$DEPLOY_ORGANIZATION" != demonstration ]; then
              approved_sha256="$(node scripts/production-approval.js require /tmp/production-approval/proof.json \
                "$DEPLOY_TARGET_ENV" "$DEPLOY_TARGET_VERSION" "$CIRCLE_WORKFLOW_ID")"
              printf 'export APPROVED_ARTIFACT_SHA256=%q\n' "$approved_sha256" >> "$BASH_ENV"
            fi
      - setup-aws-oidc
      - run:
          name: Resolve deploy marker environments
          command: |
            set -euo pipefail

            deploy_tmp_dir="$(mktemp -d)"
            marker_env_file="$deploy_tmp_dir/deploy-marker-environments.txt"
            deploy_targets_file="$deploy_tmp_dir/deploy-targets.json"
            deploy_marker_status_file="$deploy_tmp_dir/deploy-marker-status.json"
            prod_demonstration_targets_file="$deploy_tmp_dir/prod-demonstration-targets.json"

            if [ -n "$DEPLOY_ORGANIZATION" ]; then
              npm run --silent deploy -- --stage="$DEPLOY_STAGE" --organization="$DEPLOY_ORGANIZATION" --write-targets-file="$deploy_targets_file" --list-marker-environments > "$marker_env_file"
            else
              npm run --silent deploy -- --stage="$DEPLOY_STAGE" --write-targets-file="$deploy_targets_file" --list-marker-environments > "$marker_env_file"
            fi

            if [ ! -s "$marker_env_file" ]; then
              echo "No deploy marker environments were resolved"
              exit 1
            fi

            if [ "$DEPLOY_STAGE" = "sandbox" ] && [ -z "$DEPLOY_ORGANIZATION" ]; then
              npm run --silent deploy -- --stage="prod" --organization="demonstration" --write-targets-file="$prod_demonstration_targets_file" --list-marker-environments >> "$marker_env_file"
              printf 'export DEPLOY_PROD_DEMONSTRATION_TARGETS_FILE=%q\n' "$prod_demonstration_targets_file" >> "$BASH_ENV"
            fi

            printf 'export DEPLOY_TMP_DIR=%q\n' "$deploy_tmp_dir" >> "$BASH_ENV"
            printf 'export DEPLOY_MARKER_ENV_FILE=%q\n' "$marker_env_file" >> "$BASH_ENV"
            printf 'export DEPLOY_MARKER_STATUS_FILE=%q\n' "$deploy_marker_status_file" >> "$BASH_ENV"
            printf 'export DEPLOY_TARGETS_FILE=%q\n' "$deploy_targets_file" >> "$BASH_ENV"
      - run:
          name: Download release artifact
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            npm run artifact:download -- \
              --bucket=rw-frontend-artifacts-dev \
              --prefix=app-frontend \
              --tag="$DEPLOY_TARGET_VERSION" \
              --artifact=/tmp/dist.tar.gz
      - run:
          name: Verify approved artifact digest
          command: |
            set -euo pipefail
            if [ -n "${APPROVED_ARTIFACT_SHA256:-}" ]; then
              printf '%s  /tmp/dist.tar.gz\n' "$APPROVED_ARTIFACT_SHA256" | sha256sum --check --status
            fi
      - run:
          name: Unpack release artifact
          command: |
            set -euo pipefail
            rm -rf dist
            mkdir -p dist
            tar -C dist -xzf /tmp/dist.tar.gz
      - run:
          name: CircleCI Deploy Marker Plan
          command: |
            set -euo pipefail
            node scripts/deploy-markers.js plan \
              --component-name="app-frontend" \
              --env-file="$DEPLOY_MARKER_ENV_FILE" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: Deploy selected target
          command: |
            set -euo pipefail
            if [ -n "$DEPLOY_ORGANIZATION" ]; then
              npm run deploy -- --stage="$DEPLOY_STAGE" --organization="$DEPLOY_ORGANIZATION" --read-targets-file="$DEPLOY_TARGETS_FILE" --marker-status-file="$DEPLOY_MARKER_STATUS_FILE"
            else
              npm run deploy -- --stage="$DEPLOY_STAGE" --read-targets-file="$DEPLOY_TARGETS_FILE" --marker-status-file="$DEPLOY_MARKER_STATUS_FILE"
            fi

            if [ -n "${DEPLOY_PROD_DEMONSTRATION_TARGETS_FILE:-}" ]; then
              npm run deploy -- --stage="prod" --organization="demonstration" --read-targets-file="$DEPLOY_PROD_DEMONSTRATION_TARGETS_FILE" --marker-status-file="$DEPLOY_MARKER_STATUS_FILE"
            fi
      - run:
          name: CircleCI Deploy Marker Success
          when: on_success
          command: |
            set -euo pipefail
            node scripts/deploy-markers.js update \
              --deploy-result="success" \
              --env-file="$DEPLOY_MARKER_ENV_FILE" \
              --status-file="$DEPLOY_MARKER_STATUS_FILE" \
              --target-environment="$DEPLOY_TARGET_ENV" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: CircleCI Deploy Marker Failure
          when: on_fail
          command: |
            set -euo pipefail
            node scripts/deploy-markers.js update \
              --deploy-result="failure" \
              --env-file="$DEPLOY_MARKER_ENV_FILE" \
              --status-file="$DEPLOY_MARKER_STATUS_FILE" \
              --target-environment="$DEPLOY_TARGET_ENV" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: Notify QA2 E2E repo
          when: on_success
          command: |
            set -euo pipefail

            if [ "$DEPLOY_STAGE" != "qa" ] || { [ -n "$DEPLOY_ORGANIZATION" ] && [ "$DEPLOY_ORGANIZATION" != "qa2" ]; }; then
              exit 0
            fi

            {
              git fetch --force --tags origin
              source_sha="$(git rev-list -n 1 "$DEPLOY_TARGET_VERSION")"
              node scripts/dispatch-qa2-e2e.js \
                --version="$DEPLOY_TARGET_VERSION" \
                --source-sha="$source_sha" \
                --source-run-url="$DEPLOY_RUN_URL"
            } || echo "QA2 E2E dispatch failed; rerun the deploy or dispatch manually if needed."
      - slack/notify:
          event: fail
          custom: |
            {
              "text": "Frontend deploy to << pipeline.deploy.environment_name >> << pipeline.deploy.target_version >>: failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Frontend deploy to << pipeline.deploy.environment_name >> `<< pipeline.deploy.target_version >>`: failed\n<${DEPLOY_RUN_URL:-${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}}|View run>"
                  }
                }
              ]
            }
      - slack/notify:
          event: pass
          custom: |
            {
              "text": "Frontend deploy to << pipeline.deploy.environment_name >> << pipeline.deploy.target_version >>: success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Frontend deploy to << pipeline.deploy.environment_name >> `<< pipeline.deploy.target_version >>`: success\n<${DEPLOY_RUN_URL:-${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}}|View run>"
                  }
                }
              ]
            }
      - run:
          name: Update Linear release stage
          when: on_success
          command: |
            set -uo pipefail

            case "$DEPLOY_STAGE" in
              qa)      linear_stage="QA" ;;
              sandbox) linear_stage="Sandbox" ;;
              prod)
                # Only the wildcard prod:* deploy represents a real release
                # event. Org-scoped prod deploys (e.g. prod:demonstration,
                # prod:apple) must not advance or complete the Linear release.
                if [ -n "$DEPLOY_ORGANIZATION" ]; then
                  echo "Skipping Linear release update for prod:$DEPLOY_ORGANIZATION"
                  exit 0
                fi
                linear_stage="Released"
                ;;
              *) exit 0 ;;
            esac

            # set -e is suspended on the left side of `||`, so chain commands
            # with `&&` to short-circuit on the first failure and let the
            # group's exit code reflect the actual outcome.
            { ./scripts/download-linear-release.sh \
                && git fetch --force --tags origin \
                && /tmp/linear-release update \
                     --release-version="$DEPLOY_TARGET_VERSION" \
                     --stage="$linear_stage" \
                && { [ "$DEPLOY_STAGE" != "prod" ] \
                     || /tmp/linear-release complete \
                          --release-version="$DEPLOY_TARGET_VERSION"; }
            } || echo "Linear release update failed; deploy succeeded. Sync manually if needed."

workflows:
  deploy-dev:
    when:
      matches:
        pattern: '^dev:[a-z0-9*-]+$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-dev
            - slack-secrets

  deploy-qa:
    when:
      matches:
        pattern: '^qa:[a-z0-9*-]+$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-dev
            - slack-secrets
            - linear-secrets

  deploy-sandbox-or-demo:
    when:
      matches:
        pattern: '^(sandbox:[a-z0-9*-]+|prod:demonstration)$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-prod
            - slack-secrets
            - linear-secrets

  deploy-prod:
    when:
      and:
        - matches:
            pattern: '^prod:[a-z0-9*-]+$'
            value: << pipeline.deploy.environment_name >>
        - not:
            equal: ["prod:demonstration", << pipeline.deploy.environment_name >>]
        - equal: ["RoundingWell/app-frontend", << pipeline.config.repository.name >>]
        - equal: [".circleci/deploy.yml", << pipeline.config.file_path >>]
        - equal: ["refs/heads/develop", << pipeline.config.ref >>]
        - equal: ["RoundingWell", << pipeline.git.repo_owner >>]
        - equal: ["app-frontend", << pipeline.git.repo_name >>]
        - equal: ["develop", << pipeline.git.branch >>]
        - equal: [<< pipeline.config.sha >>, << pipeline.git.revision >>]
    jobs:
      - Approve production release:
          type: approval
      - verify-production-approval:
          requires:
            - Approve production release
          context:
            - app-frontend-production-approval-read
      - deploy-from-artifact:
          production_approval: true
          requires:
            - verify-production-approval
          context:
            - aws-prod
            - slack-secrets
            - linear-secrets
