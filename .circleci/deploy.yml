version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.0
  slack: circleci/slack@6.1.3

aliases:
  .node-image: &node-image cimg/node:22.16

commands:
  setup-fa-auth:
    steps:
      - run:
          name: Configure npm registry auth
          command: |
            cat > ~/.npmrc \<< EOF
            # Pro Font Awesome registry
            @fortawesome:registry=https://npm.fontawesome.com/
            //npm.fontawesome.com/:_authToken=${FONTAWESOME}
            EOF
            echo "Created ~/.npmrc"

  restore-npm-cache:
    steps:
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-

  save-npm-cache:
    steps:
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  install-dependencies:
    steps:
      - run:
          name: Verify Node version matches .nvmrc
          command: |
            expected="$(tr -d '[:space:]' < .nvmrc | sed 's/^v//')"
            expected_major_minor="$(echo "$expected" | cut -d. -f1,2)"
            image_version="$(node -v)"
            image_version="${image_version#v}"
            if [[ "$image_version" != "$expected_major_minor".* ]]; then
              echo "Node version mismatch: .nvmrc=${expected_major_minor}, image=${image_version}"
              exit 1
            fi
      - setup-fa-auth
      - run:
          name: Install dependencies
          command: npm ci --prefer-offline --no-audit

  setup-aws-oidc:
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          role_session_name: app-frontend-${CIRCLE_BUILD_NUM}

jobs:
  deploy-from-artifact:
    docker:
      - image: *node-image
    steps:
      - checkout
      - restore-npm-cache
      - install-dependencies
      - save-npm-cache
      - run:
          name: Resolve deploy target
          command: |
            set -euo pipefail

            target_env="<< pipeline.deploy.environment_name >>"
            target_version="<< pipeline.deploy.target_version >>"

            if [ -z "$target_env" ]; then
              echo "Deploy target environment is required"
              exit 1
            fi

            if [ -z "$target_version" ]; then
              echo "Deploy target version is required"
              exit 1
            fi

            if [[ "$target_env" != *:* ]]; then
              echo "Unsupported deploy environment: $target_env"
              echo "Expected format: <stage>:<organization>"
              echo "Examples: dev:nick, qa:*, sandbox:banana, prod:apple"
              exit 1
            fi

            deploy_stage="${target_env%%:*}"
            deploy_organization="${target_env#*:}"

            case "$deploy_stage" in
              dev|qa|sandbox|prod)
                ;;
              *)
                echo "Unsupported deploy stage: $deploy_stage"
                echo "Supported stages: dev, qa, sandbox, prod"
                exit 1
                ;;
            esac

            if [ -z "$deploy_organization" ]; then
              echo "Deploy organization cannot be empty for target environment: $target_env"
              exit 1
            fi

            if [ "$deploy_organization" = "*" ] || [ "$deploy_organization" = "all" ]; then
              deploy_organization=""
            fi

            marker_env_slug="${target_env//:/-}"
            marker_env_slug="${marker_env_slug//\*/all}"
            marker_name="deploy-${marker_env_slug}-${target_version}"

            {
              echo "export DEPLOY_TARGET_ENV=$target_env"
              echo "export DEPLOY_TARGET_VERSION=$target_version"
              echo "export DEPLOY_STAGE=$deploy_stage"
              echo "export DEPLOY_ORGANIZATION=$deploy_organization"
              echo "export DEPLOY_MARKER_NAME=$marker_name"
            } >> "$BASH_ENV"
      - setup-aws-oidc
      - run:
          name: Download release artifact
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            npm run artifact:download -- \
              --bucket=rw-frontend-artifacts-dev \
              --prefix=app-frontend \
              --tag="$DEPLOY_TARGET_VERSION" \
              --artifact=/tmp/dist.tar.gz
      - run:
          name: Unpack release artifact
          command: |
            set -euo pipefail
            rm -rf dist
            mkdir -p dist
            tar -C dist -xzf /tmp/dist.tar.gz
      - run:
          name: CircleCI Deploy Marker Plan
          command: |
            set -euo pipefail
            circleci run release plan "$DEPLOY_MARKER_NAME" \
              --environment-name="$DEPLOY_TARGET_ENV" \
              --component-name="app-frontend" \
              --target-version="$DEPLOY_TARGET_VERSION"
      - run:
          name: Deploy selected target
          command: |
            set -euo pipefail
            if [ -n "$DEPLOY_ORGANIZATION" ]; then
              npm run deploy -- --stage="$DEPLOY_STAGE" --organization="$DEPLOY_ORGANIZATION"
            else
              npm run deploy -- --stage="$DEPLOY_STAGE"
            fi
      - run:
          name: CircleCI Deploy Marker Success
          when: on_success
          command: |
            set -euo pipefail
            circleci run release update "$DEPLOY_MARKER_NAME" --status=SUCCESS
      - run:
          name: CircleCI Deploy Marker Failure
          when: on_fail
          command: |
            set -euo pipefail
            circleci run release update "$DEPLOY_MARKER_NAME" --status=FAILED
      - slack/notify:
          event: fail
          custom: |
            {
              "text": "Frontend deploy to << pipeline.deploy.environment_name >> << pipeline.deploy.target_version >>: failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Frontend deploy to << pipeline.deploy.environment_name >> `<< pipeline.deploy.target_version >>`: failed\n<${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}|View run>"
                  }
                }
              ]
            }
      - slack/notify:
          event: pass
          custom: |
            {
              "text": "Frontend deploy to << pipeline.deploy.environment_name >> << pipeline.deploy.target_version >>: success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Frontend deploy to << pipeline.deploy.environment_name >> `<< pipeline.deploy.target_version >>`: success\n<${CIRCLE_BUILD_URL:-https://app.circleci.com/pipelines/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_ID}}|View run>"
                  }
                }
              ]
            }

workflows:
  deploy-dev:
    when:
      matches:
        pattern: '^(dev|qa):[a-z0-9*-]+$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-dev
            - slack-secrets

  deploy-prod:
    when:
      matches:
        pattern: '^(sandbox|prod):[a-z0-9*-]+$'
        value: << pipeline.deploy.environment_name >>
    jobs:
      - deploy-from-artifact:
          context:
            - aws-prod
            - slack-secrets
