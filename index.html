<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>RoundingWell</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/rwell-logo.svg" color="#0582da">
    <link rel="preconnect" href="https://login.roundingwell.com" crossorigin>
    <link rel="preload" href="/rwell-logo.svg" as="image">
    <link rel="preload" href="/appconfig.json" as="fetch" crossorigin>
    <link rel="modulepreload" href="/shared/config.js" crossorigin>
    <link rel="modulepreload" href="/shared/datadog.js" crossorigin>
    <link rel="prefetch" href="/shared/forms.js" as="script" crossorigin>
    <link rel="preload" href="/fonts/Figtree/figtree-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="msapplication-TileColor" content="#0582da">
    <style>
      html { background: #1F2B33; }
      body { margin: 0; }
      .startup-shell {
        align-items: center;
        background: #1F2B33;
        box-sizing: border-box;
        display: flex;
        inset: 0;
        justify-content: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        position: fixed;
      }
      /* startup-visual */
    </style>
  </head>
  <body>
    <div id="root" class="app-root">
      <div class="startup-shell" aria-label="Loading RoundingWell" aria-busy="true" role="status">
        <div class="startup__ambient ambient-glow" aria-hidden="true"></div>
        <div class="startup__visual" aria-hidden="true" data-startup-visual>
          <div class="startup__motion">
            <span class="startup__core"></span>
            <span class="startup__ring"></span>
            <span class="startup__ring startup__ring--offset"></span>
          </div>
          <!-- startup-logo -->
        </div>
      </div>
    </div>
    <script type="module" src="src/js/index.js"></script>
  </body>
</html>
