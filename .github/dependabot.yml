version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Match the Marionette family before the catchall groups.
      marionette:
        applies-to: version-updates
        patterns:
          - marionette
          - "@mnjs/*"
        update-types:
          - minor
          - patch
      production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
