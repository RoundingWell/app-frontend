version: 2
registries:
  github-workflows:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.GH_PRIVATE_ACCESS }}

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Match the Marionette family before the catchall groups.
      marionette:
        applies-to: version-updates
        patterns:
          - marionette
          - "@mnjs/*"
        update-types:
          - minor
          - patch
      production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    registries:
      - github-workflows
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
