pull_request_review:
  enabled: true
  rules:
    - name: Enforce RoundingWell coding standards and architecture
      prompt: >
        Review the diff using these checkpoints:

        **Tooling & Formatting**
        - Respect `.editorconfig`, `eslint.config.mjs`, and `.stylelintrc`; no dangling semicolons/spacing violations.
        - Imports follow the order: 3rd party → CSS/SCSS → utilities/base → apps → views/components → templates → local CSS.
        - Use repo aliases (`js/*`, `scss/*`) instead of long relative paths.

        **Architecture Guardrails**
        - Views must use the Marionette `ui` hash, `triggers`, and `triggerMethod`; avoid direct DOM manipulation.
        - AJAX/data access belongs in `src/js/entities-service/**`; views/apps should request data via Backbone.Radio or state models.
        - Keep feature-flag code easy to remove (guard clause pattern, minimal branching).

        **Templating & Styles**
        - SCSS follows BEM naming; do not style `.js-*` selectors and keep nesting shallow.
        - Handlebars spacing: `{{ something }}` for values, `{{#if}}{{else}}{{/if}}` without extra spaces.
        - Attribute order: class, id/name, src/for/type/href/value, title/alt, role/aria-*, boolean.
        - Use `{{{ }}}` only when rendering trusted HTML and ensure matching SCSS is imported from the JS module.

        **Internationalization**
        - Keys follow `view.directory.fileViews.viewName.stringContext`; HTML strings get an `HTML` suffix.
        - Access strings through `{{ @intl.path.to.key }}` and use `dayjs` for date formatting.

        **Generated & Restricted Files**
        - Flag edits to `packages/**/sdk/**`, FontAwesome bundles, or `release/` scripts unless clearly regenerated.
        - Ensure Formio/Five9 integrations go through existing update scripts.

        **Testing & Coverage**
        - Changes that affect UI logic should update/introduce Cypress component specs; flow/regression changes need e2e specs.
        - Remind authors to run `npm run lint`, `npm run coverage:component`, and `npm run coverage:e2e`.

        **Quality Checks**
        - Functions remain focused (<10 lines when practical); guard clauses handle edge cases first.
        - Modules stay <300 lines; suggest splitting when larger.
        - Ensure state is stored on models, not ad-hoc properties; favor composition over inheritance.

# Local development assistance
code_generation:
  enabled: true
  rules:
    - name: Follow RoundingWell patterns for new code
      prompt: >
        When generating code, follow these conventions:
        - JavaScript only—no TypeScript files or typings.
        - Use Marionette patterns: define `ui`, prefer `triggers`, call `triggerMethod` when emitting events.
        - Import SCSS from the module that renders the view; use BEM `.block__element--modifier` naming and avoid styling `.js-*` hooks.
        - Put data fetching in `src/js/entities-service/**`; other layers talk to entities via Backbone.Radio.
        - Add/update matching Cypress specs (`*.cy.js` or `test/integration/**`) and remind the reader to run coverage scripts.
        - Format Handlebars correctly (`{{ value }}`, `{{#if}}{{else}}{{/if}}`) and place strings in `src/js/i18n/en-US.yml` with formatjs key naming and `HTML` suffix for raw markup.
        - Keep functions small with guard clauses, keep modules <300 lines, and store state on models.
        - Suggest updates to release/Five9/Formio assets only via their helper scripts.

# Chat assistance
chat:
  enabled: true
  rules:
    - name: Project context awareness
      prompt: >
        You are working on a Marionette.js/Backbone.js healthcare frontend.
        Key facts:
        - Vite drives builds/tests; scripts of interest: `npm run dev`, `npm run test`, `npm run coverage`, `npm run stop`.
        - Cypress component specs live under `src/**/*.cy.js`; e2e specs live under `test/integration/**`.
        - Linting uses `eslint.config.mjs` (flat config) and `.stylelintrc` for SCSS with BEM requirements.
        - Handlebars templates use tight spacing (`{{ value }}`) and formatjs keys (`view.directory.fileViews.viewName.key`).
        - Networking logic belongs to `src/js/entities-service/**`; avoid suggesting direct fetch/XHR elsewhere.
        - Generated artifacts (Five9 SDK, FontAwesome, release bundles) should be updated via existing scripts, not manual edits.
        - No TypeScript; stick to modern JavaScript.
