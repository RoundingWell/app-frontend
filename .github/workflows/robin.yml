name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: >-
      !endsWith(github.actor, '[bot]') && (
        github.event_name == 'pull_request' ||
        (github.event.issue.pull_request &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         (startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')))
      )
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 45
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.ROBIN_CLIENT_ID }}
          private-key: ${{ secrets.ROBIN_PRIVATE_KEY }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: write
      - uses: antongulin/robin@c307d49e53284c3c0e05c9a764ab9e8cce6f7dff # v2.13.3
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}
